<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <rect width="960" height="420" rx="18" fill="#f7f7fa"/>

  <!-- Left: open tabs across windows, with duplicates -->
  <text x="40" y="48" font-size="15" font-weight="700" fill="#1c1b22">Your open tabs</text>
  <text x="40" y="68" font-size="12" fill="#6e6c7a">2 windows · 8 tabs · duplicates mixed in</text>

  <g transform="translate(40 86)">
    <rect width="330" height="128" rx="10" fill="#fff" stroke="#ebeaf0"/>
    <circle cx="16" cy="16" r="4" fill="#ff5f57"/><circle cx="30" cy="16" r="4" fill="#febc2e"/><circle cx="44" cy="16" r="4" fill="#28c840"/>
    <g font-size="12" fill="#1c1b22">
      <rect x="12" y="32" width="306" height="20" rx="5" fill="#f5f4f8"/><text x="22" y="46">github.com/project</text>
      <rect x="12" y="56" width="306" height="20" rx="5" fill="#f5f4f8"/><text x="22" y="70">youtube.com/watch?v=talk</text>
      <rect x="12" y="80" width="306" height="20" rx="5" fill="#fdecea"/><text x="22" y="94" fill="#c43a31">github.com/project#readme</text><text x="306" y="94" text-anchor="end" font-size="10" fill="#c43a31">duplicate</text>
      <rect x="12" y="104" width="306" height="20" rx="5" fill="#f5f4f8"/><text x="22" y="118">docs.python.org/3/library</text>
    </g>
  </g>
  <g transform="translate(40 226)">
    <rect width="330" height="128" rx="10" fill="#fff" stroke="#ebeaf0"/>
    <circle cx="16" cy="16" r="4" fill="#ff5f57"/><circle cx="30" cy="16" r="4" fill="#febc2e"/><circle cx="44" cy="16" r="4" fill="#28c840"/>
    <g font-size="12" fill="#1c1b22">
      <rect x="12" y="32" width="306" height="20" rx="5" fill="#f5f4f8"/><text x="22" y="46">wikipedia.org/wiki/Tabs</text>
      <rect x="12" y="56" width="306" height="20" rx="5" fill="#fdecea"/><text x="22" y="70" fill="#c43a31">http://www.github.com/project</text><text x="306" y="70" text-anchor="end" font-size="10" fill="#c43a31">duplicate</text>
      <rect x="12" y="80" width="306" height="20" rx="5" fill="#f5f4f8"/><text x="22" y="94">news.ycombinator.com</text>
      <rect x="12" y="104" width="306" height="20" rx="5" fill="#fdecea"/><text x="22" y="118" fill="#c43a31">youtube.com/watch?v=talk</text><text x="306" y="118" text-anchor="end" font-size="10" fill="#c43a31">duplicate</text>
    </g>
  </g>

  <!-- Middle: one click -->
  <g transform="translate(400 170)">
    <line x1="0" y1="50" x2="128" y2="50" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 5"/>
    <path d="M128 42 L142 50 L128 58 Z" fill="#7c3aed"/>
    <rect x="42" y="22" width="56" height="56" rx="14" fill="#7c3aed"/>
    <path d="M60 36 h20 v32 l-10 -8 l-10 8 Z" fill="#fff"/>
    <rect x="64" y="42" width="12" height="3" rx="1.5" fill="#7c3aed"/><rect x="64" y="49" width="9" height="3" rx="1.5" fill="#7c3aed"/>
    <text x="70" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#1c1b22">One click</text>
    <text x="70" y="122" text-anchor="middle" font-size="11" fill="#6e6c7a">or Alt+Shift+S</text>
  </g>

  <!-- Right: one clean list -->
  <text x="580" y="48" font-size="15" font-weight="700" fill="#1c1b22">One clean list</text>
  <text x="580" y="68" font-size="12" fill="#6e6c7a">merged · de-duplicated · sorted by site</text>
  <g transform="translate(580 86)">
    <rect width="340" height="268" rx="10" fill="#fff" stroke="#ebeaf0"/>
    <g font-size="12.5" fill="#1c1b22">
      <text x="20" y="38">github.com/project</text>
      <rect x="250" y="24" width="70" height="20" rx="10" fill="#f1eafe"/><text x="285" y="38" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7c3aed">3 → 1</text>
      <line x1="16" x2="324" y1="56" y2="56" stroke="#f0eff4"/>
      <text x="20" y="84">docs.python.org/3/library</text>
      <line x1="16" x2="324" y1="102" y2="102" stroke="#f0eff4"/>
      <text x="20" y="130">wikipedia.org/wiki/Tabs</text>
      <line x1="16" x2="324" y1="148" y2="148" stroke="#f0eff4"/>
      <text x="20" y="176">news.ycombinator.com</text>
      <line x1="16" x2="324" y1="194" y2="194" stroke="#f0eff4"/>
      <text x="20" y="222">youtube.com/watch?v=talk</text>
      <rect x="250" y="208" width="70" height="20" rx="10" fill="#f1eafe"/><text x="285" y="222" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7c3aed">2 → 1</text>
      <text x="20" y="252" font-size="11" fill="#a3a1ad">8 tabs saved as 5 links. Tabs stay open.</text>
    </g>
  </g>

  <!-- Bottom: what else happens automatically -->
  <g font-size="12" font-weight="500" fill="#6e6c7a">
    <rect x="40" y="374" width="190" height="28" rx="14" fill="#fff" stroke="#ebeaf0"/><text x="135" y="392" text-anchor="middle">Auto-saves every hour</text>
    <rect x="244" y="374" width="190" height="28" rx="14" fill="#fff" stroke="#ebeaf0"/><text x="339" y="392" text-anchor="middle">Weekly backup file</text>
    <rect x="448" y="374" width="190" height="28" rx="14" fill="#fff" stroke="#ebeaf0"/><text x="543" y="392" text-anchor="middle">Fast with 15,000+ tabs</text>
    <rect x="652" y="374" width="268" height="28" rx="14" fill="#fff" stroke="#ebeaf0"/><text x="786" y="392" text-anchor="middle">Everything stays in your browser</text>
  </g>
</svg>
