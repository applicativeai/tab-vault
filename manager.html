<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tab Vault</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { display: grid; grid-template-columns: 240px 1fr; height: 100vh; overflow: hidden; }
    aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    aside h1 { font-size: 15px; margin: 0; padding: 14px 14px 10px; }
    .side-actions { padding: 0 10px 10px; }
    .side-actions button { width: 100%; }
    #saved { color: var(--accent); margin-left: 8px; }
    #nav { flex: 1; overflow: auto; padding: 0 6px; }
    .nav-item { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
    .nav-item:hover { background: var(--hover); }
    .nav-item.active { background: var(--sel); font-weight: 600; }
    .nav-item .n { color: var(--muted); font-variant-numeric: tabular-nums; }
    .nav-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; padding: 12px 8px 4px; }
    .backup { padding: 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
    .backup button { flex: 1; }
    .backup-status { padding: 10px 10px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .backup-status + .backup { border-top: 0; }
    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    header { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    header input { flex: 1 1 260px; }
    #status { padding: 6px 14px; font-size: 12px; border-bottom: 1px solid var(--line); }
    #count { color: var(--muted); }
    #cats { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); }
    .chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; }
    .chip span { color: var(--muted); margin-left: 2px; }
    .chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
    .chip.active span { color: inherit; opacity: .8; }
    .toggle[aria-pressed="true"] { background: var(--sel); border-color: var(--accent); }
    .row.group { cursor: pointer; font-weight: 600; }
    .row.group .chev { width: 10px; color: var(--muted); }
    .row.group .site { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row.group .n { color: var(--muted); font-weight: 400; font-size: 12px; }
    .row.nested { padding-left: 40px; }
    #viewport { flex: 1; overflow-y: auto; position: relative; }
    #spacer { position: relative; }
    .row {
      position: absolute; left: 0; right: 0; height: 32px; display: flex; align-items: center; gap: 10px;
      padding: 0 14px; border-bottom: 1px solid var(--line);
    }
    .row:hover { background: var(--hover); }
    .row.sel { background: var(--sel); }
    .row img { width: 16px; height: 16px; flex: none; }
    .row a { color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0; }
    .row a:hover { text-decoration: underline; }
    .row .url { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 40%; min-width: 0; font-size: 12px; }
    .row .del { border: 0; background: none; color: var(--muted); padding: 2px 6px; visibility: hidden; }
    .row:hover .del { visibility: visible; }
    .row .del:hover { color: var(--danger); }
    .empty { padding: 40px; text-align: center; color: var(--muted); }
    .session-only { display: none; }
    body.in-session .session-only { display: inline-block; }
  </style>
</head>
<body>
  <aside>
    <h1>Tab Vault</h1>
    <div class="side-actions">
      <button id="saveSession" title="Save every open tab as its own named session, kept apart from the common list">Save tabs as session…</button>
    </div>
    <div id="nav"></div>
    <div class="backup-status">
      <span id="lastBackup"></span>
      <button id="backupNow" title="Save a backup to Downloads/TabVault now">Back up now</button>
    </div>
    <div class="backup">
      <button id="export" title="Download everything as a JSON file">Export</button>
      <button id="import" title="Merge a backup JSON file into your data">Import</button>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </div>
  </aside>
  <main>
    <header>
      <input type="search" id="q" placeholder="Search title or URL…  ( / )" autofocus>
      <select id="sort" title="Sort order">
        <option value="url">Sort: URL A→Z</option>
        <option value="newest">Sort: Newest saved</option>
        <option value="oldest">Sort: Oldest saved</option>
      </select>
      <button id="group" class="toggle" title="Collapse tabs into one row per website">Group by site</button>
      <button id="selAll">Select all</button>
      <button id="selNone">Clear</button>
      <button id="open">Open selected</button>
      <button id="del" class="danger">Delete selected</button>
      <button id="merge" class="session-only">Merge into common list</button>
      <button id="rename" class="session-only">Rename</button>
      <button id="delSession" class="session-only danger">Delete session</button>
    </header>
    <div id="cats"></div>
    <div id="status"><span id="count"></span><span id="saved"></span></div>
    <div id="viewport"><div id="spacer"></div></div>
  </main>
  <script type="module" src="manager.js"></script>
</body>
</html>
